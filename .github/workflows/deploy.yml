# Deploy the AgentsMesh self-host stack to THIS laptop on push to main.
#
# Replaces the upstream cloud pipeline (dual-registry push + SSH to aliyun
# hosts), which targets AgentsMesh-team infra this fork cannot reach.
#
# Runs on a self-hosted GitHub Actions runner registered on the laptop.
# Host prerequisites for that runner:
#   - bazelisk/bazel and docker (+ compose) on PATH, docker socket access
#   - the persistent self-host checkout at $AGENTSMESH_DIR with a populated
#     deploy/selfhost/.env (VERSION=local)
#
# Safety: rebuilds the fork-fixed :local images from source and `up -d`s the
# stack with `--pull never`. It must NEVER pull agentsmesh/backend|web|
# web-admin|relay - that would replace the :local images and silently drop the
# fork fixes (webhook slug, signup lock, PR normalizer, quota UX).

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-laptop
  cancel-in-progress: false

env:
  AGENTSMESH_DIR: /home/malfirg/programming_projects/AgentsMesh

jobs:
  deploy-laptop:
    name: Rebuild images + restart self-host stack
    runs-on: self-hosted
    steps:
      - name: Checkout (clean, isolated build tree)
        uses: actions/checkout@v6

      - name: Rebuild fork :local images and load into docker
        run: |
          set -euo pipefail
          # bazel run <image_tarball> loads "agentsmesh/<binary>:latest" (the
          # source tag varies: backend->server, web->image). Parse the loaded
          # tag rather than hardcode, then retag to the :local name the compose
          # file references (agentsmesh/<svc>:local).
          load_and_tag() {
            local target="$1" dest="$2" loaded
            loaded="$(bazel run "$target" 2>&1 | grep -oE 'agentsmesh/[A-Za-z0-9_-]+:latest' | tail -1)"
            [ -n "$loaded" ] || { echo "could not determine loaded image for $target" >&2; exit 1; }
            docker tag "$loaded" "$dest"
            echo "tagged $loaded -> $dest"
          }
          load_and_tag //backend/cmd/server:image_tarball agentsmesh/backend:local
          load_and_tag //clients/web:image_tarball        agentsmesh/web:local
          load_and_tag //clients/web-admin:image_tarball  agentsmesh/web-admin:local
          load_and_tag //relay/cmd/relay:image_tarball    agentsmesh/relay:local

      - name: Restart stack from the persistent self-host dir
        run: |
          set -euo pipefail
          cd "$AGENTSMESH_DIR/deploy/selfhost"
          docker compose up -d --pull never
          docker compose ps

      - name: Reclaim disk (retention for superseded images)
        if: always()
        run: |
          set -euo pipefail
          # Re-tagging :local on every deploy orphans the previous image as a
          # dangling layer; prune those plus stale build cache. In-use images
          # (the running stack) are referenced and never removed.
          docker image prune -f
          docker builder prune -f
          docker system df
